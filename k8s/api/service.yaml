apiVersion: v1
kind: Service
metadata:
  name: todo-api
  namespace: todo-app
  labels:
    app: todo-api
    tier: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: todo-api
    tier: backend
---
# NodePort: browser calls the API directly from outside the cluster
apiVersion: v1
kind: Service
metadata:
  name: todo-api-nodeport
  namespace: todo-app
  labels:
    app: todo-api
    tier: backend
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
  selector:
    app: todo-api
    tier: backend
