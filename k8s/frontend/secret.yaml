apiVersion: v1
kind: Secret
metadata:
  name: todo-frontend-secret
  namespace: todo-app
  labels:
    app: todo-frontend
    tier: frontend
type: Opaque
# REACT_APP_API_ENDPOINT must be the URL the BROWSER can reach.
# For minikube: http://$(minikube ip):30080
# Update this value to match your minikube IP before applying.
stringData:
  REACT_APP_API_ENDPOINT: "http://$(minikube ip):30080"
